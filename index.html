<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FRASEK">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FRASEK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#f5efe7; --card:#fffdf9; --soft:#ece3d7; --seg:#e7dccd;
  --line:#dccdbb; --dash:#c9b7a2; --dash2:#e8dccd;
  --ink:#1c1916; --muted:#66584c; --eyebrow:#a8481f; --h1:#1c1916;
  --accent:#a8481f; --fill:#b8502a; --fill-ink:#ffffff; --btn:#1c1916; --btn-ink:#fffdf9;
  --good:#2f6b3f; --good-soft:#dde8d8; --warn:#6b4a2e; --warn-soft:#f1e3d2; --bad:#a3281c; --bad-soft:#f3d9d3;
  --focus:#b8502a;
  --serif:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;
  --sans:'Montserrat','Segoe UI',Helvetica,Arial,sans-serif;
  --brand:'Rye',Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#1c1916; --card:#25201c; --soft:#302924; --seg:#2c2621;
  --line:#40372f; --dash:#564a40; --dash2:#352d27;
  --ink:#f6efe6; --muted:#b9ab9c; --eyebrow:#e88a5c; --h1:#f6efe6;
  --accent:#ec8a5d; --fill:#e07042; --fill-ink:#1c1916; --btn:#e07042; --btn-ink:#1c1916;
  --good:#8fc49b; --good-soft:#1d3024; --warn:#e3c3a6; --warn-soft:#352a21; --bad:#ff8f80; --bad-soft:#40201b;
  --focus:#ec8a5d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1c1916; --card:#25201c; --soft:#302924; --seg:#2c2621;
  --line:#40372f; --dash:#564a40; --dash2:#352d27;
  --ink:#f6efe6; --muted:#b9ab9c; --eyebrow:#e88a5c; --h1:#f6efe6;
  --accent:#ec8a5d; --fill:#e07042; --fill-ink:#1c1916; --btn:#e07042; --btn-ink:#1c1916;
  --good:#8fc49b; --good-soft:#1d3024; --warn:#e3c3a6; --warn-soft:#352a21; --bad:#ff8f80; --bad-soft:#40201b;
  --focus:#ec8a5d;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.numf{font-family:var(--sans);font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
.serif,.big,.v,b.serif{font-weight:700}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1;color:var(--h1);font-weight:400}
h2{font-size:22px}
h3{font-size:17px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;padding-bottom:10px}
.brand{align-items:center!important}.brand img{width:44px;height:44px;border-radius:50%;flex:none}
.brand b{font-family:var(--brand);font-size:24px;font-weight:400;color:var(--ink);letter-spacing:.04em;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);font-weight:700;margin-top:3px}
.brand span{font-size:12px;color:var(--muted)}
.theme-btn{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;order:3}

.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:none;min-height:44px;padding:0 12px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* cards & tiles */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flat{background:transparent;border-style:dashed}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--sans);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.tile.hero .k,.tile.hero .s{color:var(--fill-ink);opacity:.9}
.tile.good .v{color:var(--good)} .tile.bad .v{color:var(--bad)}

/* buttons & inputs */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.quiet{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--line);color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.in{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;color:var(--ink);font-size:15px}
textarea.in{padding:10px;min-height:96px;resize:vertical;line-height:1.45}
.in.num-in{text-align:right;font-variant-numeric:tabular-nums}
.in.cell{min-height:36px;border-color:transparent;background:transparent;padding:0 6px}
.in.cell:hover{border-color:var(--dash)}
.in.cell:focus{border-color:var(--accent);background:var(--card)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles>:last-child:nth-child(odd){grid-column:1/-1}}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink);font-weight:600}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;min-height:44px;padding:0 12px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

/* butcher-slip table */
.tw{overflow-x:auto;margin-inline:-4px}
table.slip{width:100%;border-collapse:collapse;font-size:14px}
table.slip th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px dashed var(--dash);white-space:nowrap}
table.slip td{padding:8px 6px;border-bottom:1px dashed var(--dash2);vertical-align:middle}
table.slip tr:last-child td{border-bottom:0}
table.slip .r{text-align:right}
table.slip .big{font-family:var(--sans);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.slip tfoot td{border-top:1px solid var(--ink);border-bottom:0;padding-top:10px}
.nm{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--eyebrow);border:0;cursor:pointer;white-space:nowrap}
.chip.hint{background:transparent;color:var(--accent);border:1px solid var(--accent)}

.pick{min-height:38px;padding:0 12px;border-radius:99px;border:1px dashed var(--dash);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.pick.check svg{display:none;margin-right:6px}.pick.check[aria-pressed="true"] svg{display:inline}
.pick{display:inline-flex;align-items:center}
.pick[aria-pressed="true"]{background:var(--fill);border:1px solid var(--fill);color:var(--fill-ink);font-weight:600}
.qgroup{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:start}
.qlabel{font-size:13px;color:var(--eyebrow);font-weight:600;padding-top:9px}
.qtable td{padding:10px 4px}.qtable th{padding-inline:4px}
.qtable td:nth-child(-n+3){min-width:140px}.qtable td:nth-child(n+4){width:90px}
@media (max-width:700px){
  .qtable thead{display:none}
  .qtable tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qtable td{padding:0;border:0!important;min-width:0!important;width:auto!important}
  .qtable td:first-child{grid-column:1/-1}
  .qtable td::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .qgroup{grid-template-columns:minmax(0,1fr);gap:4px}.qlabel{padding-top:0}
}
/* dumb-proof */
.btn.big{min-height:56px;font-size:17px;padding:0 22px;border-radius:12px}
.ev1{max-width:640px;margin:0 auto;width:100%}
.title-in{font-family:var(--serif);font-size:22px;font-weight:700;min-height:52px}
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.steppers{grid-template-columns:minmax(0,1fr)}}
.stepper label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.stepper-in{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper-in .in{border:0;border-radius:0;text-align:center;font-family:var(--sans);font-size:22px;font-weight:700;min-height:52px;min-width:0}
.stp{width:52px;flex:none;border:0;background:var(--soft);color:var(--ink);font-size:24px;cursor:pointer}
.stp:active{background:var(--seg)}
.menu-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.menu-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:72px;padding:12px 14px;border-radius:12px;border:1px dashed var(--dash);background:transparent;color:var(--ink);cursor:pointer}
.menu-card b{font-family:var(--serif);font-size:17px}
.menu-card span{font-size:13px;color:var(--muted)}
.menu-card[aria-pressed="true"]{background:var(--fill);border:1px solid var(--fill);color:var(--fill-ink)}
.menu-card[aria-pressed="true"] span{color:var(--fill-ink);opacity:.9}
.price-big{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 0}
.price-big>span:first-child{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);font-weight:600}
.price-big b{font-family:var(--sans);font-size:clamp(40px,10vw,56px);line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums}
.bigbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.bigbtns{grid-template-columns:minmax(0,1fr)}}
details.card.flat summary h2{font-size:18px}
@media (max-width:640px){
  .cat-table thead{display:none}
  .cat-table tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 44px;gap:4px 8px;padding:10px 0;border-bottom:1px dashed var(--dash2)}
  .cat-table td{border:0!important;padding:0!important;text-align:left!important}
  .cat-table td:first-child{grid-column:1/3}
  .cat-table td:last-child{grid-column:3;grid-row:1}
  .cat-table td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  .cat-table td:first-child .in{font-weight:600}
  .cat-table td .row{justify-content:flex-start!important}
  .cat-table td:nth-child(2){grid-column:1;grid-row:2}
  .cat-table td:nth-child(4){grid-column:2/-1;grid-row:2}
  .cat-table td:nth-child(3){grid-column:1;grid-row:3}
  .cat-table td:nth-child(5){grid-column:2/-1;grid-row:3}
  .cat-table td:nth-child(2) .in{width:auto}
}
/* checklist */
.checklist{display:flex;flex-direction:column;gap:14px}
.cl-group{display:flex;flex-direction:column}
.cl-cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--eyebrow);font-weight:600;padding-bottom:4px;border-bottom:1px dashed var(--dash)}
.cl-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:50px;padding:6px 4px;border:0;border-bottom:1px dashed var(--dash2);background:none;color:var(--ink);text-align:left;cursor:pointer;font-size:16px;width:100%}
.cl-row:hover{background:var(--soft)}
.cl-box{width:26px;height:26px;border-radius:7px;border:2px solid var(--dash);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.cl-row[aria-pressed="true"] .cl-box{background:var(--fill);border-color:var(--fill);color:var(--fill-ink)}
.cl-row[aria-pressed="true"] .cl-name{font-weight:600}
.cl-row[aria-pressed="false"] .cl-name{color:var(--muted)}
.cl-price{font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl-row[aria-pressed="false"] .cl-price{color:var(--muted);font-weight:500;font-family:var(--sans);font-size:14px}
.pricebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--fill);color:var(--fill-ink);border-radius:14px;padding:12px 18px;box-shadow:0 8px 24px rgba(20,12,9,.25)}
.pricebar span{display:block;font-size:12px;opacity:.9}
.pricebar b{font-family:var(--sans);font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pricebar .pb-r{text-align:right}.pricebar .pb-r b{font-size:18px}
/* simple event */
.tiles3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.tiles3{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles3>.hero{grid-column:1/-1}.tiles3>:last-child:nth-child(odd){grid-column:auto}}
.evbody{max-width:820px}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:99px;background:var(--fill);color:var(--fill-ink);font-family:var(--sans);font-size:13px;font-weight:700;margin-right:10px;vertical-align:2px}
.sub-details{border-top:1px dashed var(--dash);padding-top:10px}
.sub-details summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center;gap:6px}
.sub-details summary .muted{font-weight:400}
.sub-details[open] summary{margin-bottom:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
/* per-person strip */
.pp-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.pp-strip>div{background:var(--soft);padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.pp-strip>div:first-child{background:var(--fill);color:var(--fill-ink)}
.pp-strip .k{font-size:12px;opacity:.85}
.pp-strip b{font-family:var(--sans);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-strip .s{font-size:12px;opacity:.8}
@media (max-width:420px){.pp-strip b{font-size:18px}}
/* date picker */
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.datebtn svg{flex:none;color:var(--muted)}
#dp-back{position:fixed;inset:0;z-index:30;background:rgba(20,12,9,.25)}
#dp{position:fixed;z-index:31;width:300px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 36px rgba(20,12,9,.25);display:flex;flex-direction:column;gap:10px}
#dp[hidden],#dp-back[hidden]{display:none}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dp-head b{font-family:var(--serif);font-size:17px;text-transform:capitalize}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.dp-grid .wd{font-size:11px;color:var(--eyebrow);letter-spacing:.06em;padding:4px 0;font-weight:600}
.dp-day{height:38px;border:0;border-radius:8px;background:none;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.dp-day:hover{background:var(--soft)}
.dp-day.out{color:var(--muted);opacity:.45}
.dp-day.today{box-shadow:inset 0 0 0 1px var(--dash)}
.dp-day[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink);font-weight:700}
.dp-foot{display:flex;gap:8px;justify-content:space-between;align-items:center}
.dp-foot .row{flex-wrap:nowrap}.dp-foot .btn{padding:0 10px}
@media (max-width:560px){#dp{left:16px!important;right:16px;top:auto!important;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;max-width:none}}
/* status pills */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st-povprasevanje{background:var(--soft);color:var(--eyebrow)}
.st-ponudba{background:var(--warn-soft);color:var(--warn)}
.st-potrjeno{background:var(--fill);color:var(--fill-ink)}
.st-izvedeno{background:var(--seg);color:var(--ink)}
.st-obracunano{background:var(--good-soft);color:var(--good)}

/* events list */
.evlist{display:flex;flex-direction:column}
.evrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px dashed var(--dash);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.evrow:hover{background:var(--soft)}
.evdate{font-family:var(--sans);font-weight:700;text-align:center;line-height:1}
.evdate b{display:block;font-size:26px}
.evdate span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.evmoney{text-align:right}
.evmoney b{font-family:var(--sans);font-size:18px;font-variant-numeric:tabular-nums}

/* layout for event */
.evgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}

<body>
<div id="app" aria-live="polite"><div class="wrap" style="padding-top:40px"><p class="muted">Nalagam …</p></div></div>
<div id="toast" class="toast" hidden></div>
<div id="dp-back" hidden></div><div id="dp" role="dialog" aria-modal="true" aria-label="Izbira datuma" hidden></div>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const CATS = { meso:'Meso', priloge:'Priloge', pijaca:'Pijača', drugo:'Drugo', storitve:'Storitve' };
const UNITS = { kg:'kg', kos:'kos', l:'l', kgm:'kg', dog:'dogodek', os:'os' };
const UNIT_LABELS = { kg:'g', kos:'kos', l:'l', kgm:'kg/kg mesa' };
const SVC_UNITS = { dog:'na dogodek', os:'na osebo' };
const UNIT_OPTS = { kg:'kg / os', kos:'kos / os', l:'l / os', kgm:'kg / kg mesa' };
const normP = p => { if(p.cat==='oglje'){ p.cat='drugo'; p.unit='kgm'; } p.perMeat = p.unit==='kgm'; return p; };
const STATUS = { povprasevanje:'Povpraševanje', ponudba:'Ponudba poslana', potrjeno:'Potrjeno', izvedeno:'Izvedeno', obracunano:'Obračunano' };
const APPETITE = { lahek:'Lahek', obicajen:'Običajen', lacni:'Lačni' };
const DEFAULT_SETTINGS = {
  company:'', signature:'', markupPct:35, reservePct:8, childFactor:0.5, childPriceFactor:0.5,
  vatFood:9.5, vatDrinks:22, appetite:{ lahek:0.85, obicajen:1, lacni:1.2 }
};
const EXTRA_SUGGEST = ['Delo (ure × urna postavka)','Prevoz','Najem opreme','Plin / elektrika','Embalaža'];

/* ---------- state ---------- */
const S = {
  settings: structuredClone(DEFAULT_SETTINGS),
  catalog:{}, suppliers:{}, events:{}, menus:{},
  view: loadView(), mode:'loading', loaded:{events:false,catalog:false,suppliers:false,settings:false,menus:false},
  draft: loadDraft(),
  ui:{ confirm:null, aiBusy:false, aiErr:'', offerBusy:false }
};
let db=null, sample=null, downloads=null;
const pending = new Map();       // "col/id" -> timer
let lastInput = 0, renderTimer = null;

function loadDraft(){ try{ const d=JSON.parse(localStorage.getItem('pt-draft')||'null'); return d&&d.id&&d.ev?d:null; }catch(e){ return null; } }
function saveDraft(){ try{ if(S.draft) localStorage.setItem('pt-draft',JSON.stringify(S.draft)); else localStorage.removeItem('pt-draft'); }catch(e){} }
function loadView(){ try{ const v=JSON.parse(localStorage.getItem('pt-view')||'null'); if(v&&v.name) return v; }catch(e){} return {name:'events'}; }
function saveView(){ try{ localStorage.setItem('pt-view', JSON.stringify(S.view)); }catch(e){} }

/* ---------- theme ---------- */
function isDark(){ const t=document.documentElement.dataset.theme; if(t) return t==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; }
try{ applyTheme(localStorage.getItem('pt-theme')||'dark'); }catch(e){ applyTheme('dark'); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>scheduleRender()); }catch(e){}

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (typeof v === 'number') return Number.isFinite(v) ? v : 0; const x = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',','.')); return Number.isFinite(x) ? x : 0; };
const nf = (n,d=1) => Number.isFinite(n) ? n.toLocaleString('sl-SI',{minimumFractionDigits:d,maximumFractionDigits:d}) : '–';
const eur = n => Number.isFinite(n) ? n.toLocaleString('sl-SI',{style:'currency',currency:'EUR'}) : '–';
const inVal = n => (n === null || n === undefined || n === '') ? '' : String(n).replace('.',',');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const qty = (n,unit) => unit === 'kos' ? nf(n,0)+' kos' : nf(n,1)+' '+(UNITS[unit]||unit);
const clone = o => JSON.parse(JSON.stringify(o));
function fmtDate(d){ if(!d) return 'brez datuma'; const t=new Date(d+'T12:00:00'); if(isNaN(t)) return d; return t.toLocaleDateString('sl-SI',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function gppLabel(p){ if(p.unit==='kgm'||p.cat==='oglje') return 'kg / kg mesa'; return p.unit==='kg' ? 'g / os' : (p.unit==='kos' ? 'kos / os' : 'l / os'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true},2200); }

/* ---------- storage layer ---------- */
const COLS = ['events','catalog','suppliers','menus'];
function localPersist(){ try{ localStorage.setItem('pt-local', JSON.stringify({settings:S.settings,catalog:S.catalog,suppliers:S.suppliers,events:S.events,menus:S.menus})); }catch(e){} }
const SEED={"catalog": {"p_bedra": {"bonePct": 25, "cat": "meso", "gpp": 120, "name": "Piščančja bedra", "pack": 2, "price": 6.5, "unit": "kg"}, "p_kranjska": {"bonePct": 0, "cat": "meso", "gpp": 1, "name": "Kranjska klobasa", "pack": 0, "price": 2.2, "unit": "kos"}, "p_vrat": {"bonePct": 0, "cat": "meso", "gpp": 150, "name": "Svinjski vrat", "pack": 0, "price": 8.9, "unit": "kg"}, "p_cevap": {"bonePct": 0, "cat": "meso", "gpp": 120, "name": "Čevapčiči", "pack": 0, "price": 9.5, "unit": "kg"}, "p_kruh": {"bonePct": 0, "cat": "priloge", "gpp": 100, "name": "Kruh", "pack": 0, "price": 2.8, "unit": "kg"}, "p_krompir": {"bonePct": 0, "cat": "priloge", "gpp": 150, "name": "Krompirjeva solata", "pack": 0, "price": 3.2, "unit": "kg"}, "p_rebra": {"bonePct": 40, "cat": "meso", "gpp": 200, "name": "Svinjska rebrca", "pack": 0, "price": 7.9, "unit": "kg"}, "p_sok": {"bonePct": 0, "cat": "pijaca", "gpp": 0.75, "name": "Sokovi in voda", "pack": 0, "price": 1.1, "unit": "l"}, "p_pivo": {"bonePct": 0, "cat": "pijaca", "gpp": 1, "name": "Pivo (sod)", "pack": 50, "price": 3, "unit": "l"}, "p_oglje": {"bonePct": 0, "cat": "drugo", "gpp": 0.5, "name": "Oglje", "pack": 10, "price": 1.6, "unit": "kgm"}, "p_ajvar": {"bonePct": 0, "cat": "priloge", "gpp": 40, "name": "Ajvar in omake", "pack": 0, "price": 6, "unit": "kg"}, "p_zelenjava": {"bonePct": 0, "cat": "priloge", "gpp": 120, "name": "Zelenjava za žar", "pack": 0, "price": 3.5, "unit": "kg"}, "p_raznjic": {"bonePct": 0, "cat": "meso", "gpp": 120, "name": "Ražnjiči", "pack": 0, "price": 11.5, "unit": "kg"}}, "menus": {}, "settings": {"advanced": false, "appetite": {"lacni": 1.2, "lahek": 0.85, "obicajen": 1}, "childFactor": 0.5, "childPriceFactor": 0.5, "company": "", "markupPct": 35, "reservePct": 8, "signature": "", "vatDrinks": 22, "vatFood": 9.5}, "events": {}, "suppliers": {}};
function localLoad(){ try{ const d=JSON.parse(localStorage.getItem('pt-local')||'null')||SEED; if(d){ Object.assign(S, {settings:{...clone(DEFAULT_SETTINGS),...d.settings}, catalog:d.catalog||{}, suppliers:d.suppliers||{}, events:d.events||{}, menus:d.menus||{}}); } }catch(e){} }

function saveLater(col,id,delay=500){
  const key=col+'/'+id;
  clearTimeout(pending.get(key));
  pending.set(key, setTimeout(()=>flush(col,id), delay));
}
async function flush(col,id){
  const key=col+'/'+id; pending.delete(key);
  const data = col==='settings' ? S.settings : S[col][id];
  if(!db){ localPersist(); return; }
  try{ if(data) await db.collection(col).doc(id).set(clone(data)); }
  catch(e){ handleDbError(e); }
}
async function removeDoc(col,id){
  delete S[col][id];
  if(!db){ localPersist(); return; }
  try{ await db.collection(col).doc(id).delete(); }catch(e){ handleDbError(e); }
}
function handleDbError(e){
  if(e && e.code==='permission-denied'){ showLogin('Račun '+(S.user&&S.user.email||'')+' nima dostopa. Prosi lastnika, da te doda.', true); return; }
  if(e && e.code==='quota_exceeded') toast('Shramba je polna – izbriši stare dogodke.');
  else if(e && e.code==='unavailable') toast('Shranjevanje trenutno ne gre – poskusi znova čez trenutek.');
  else toast('Shranjevanje ni uspelo.');
}

let fbAuth=null;
const FB_DEFAULT={apiKey:"AIzaSyCHhJm-UpT8igMnQc-adAjHHIlAXxy5T0I",authDomain:"frasek-14d72.firebaseapp.com",projectId:"frasek-14d72",storageBucket:"frasek-14d72.firebasestorage.app",messagingSenderId:"76830761934",appId:"1:76830761934:web:9565d8fee51a4fdd79419f"};
function fbCfg(){ const c=window.FRASEK_FIREBASE; return (c&&c.apiKey&&!/VPI/.test(c.apiKey))?c:FB_DEFAULT; }
function fbConfigured(){ return !!window.firebase; }
function showLogin(msg,signedIn){
  $app.innerHTML=`<div class="login"><img src="icon-192.png" alt="FRAS BBQ"><h1>FRASEK</h1><p class="muted">Kalkulacije menijev za FRAS BBQ</p>
  ${signedIn?`<button type="button" class="btn big" data-act="logout">Odjava</button>`:`<button type="button" class="btn big" data-act="login">Prijava z Google</button>`}
  ${msg?`<p class="small" style="color:var(--bad);max-width:34ch">${esc(msg)}</p>`:''}</div>`;
}
function getFirebaseDb(){
  if(!fbConfigured()) return Promise.resolve(null);
  firebase.initializeApp(fbCfg());
  fbAuth=firebase.auth();
  return new Promise(res=>{
    fbAuth.getRedirectResult().catch(e=>showLogin('Prijava ni uspela: '+(e.message||e.code)));
    let done=false;
    fbAuth.onAuthStateChanged(async u=>{
      if(!u){ showLogin(); return; }
      if(done) return; done=true; S.user=u;
      const fs=firebase.firestore();
      try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
      try{
        const c=await fs.collection('catalog').limit(1).get();
        if(c.empty){ const b=fs.batch(); Object.entries(SEED.catalog).forEach(([id,d])=>b.set(fs.collection('catalog').doc(id),d)); b.set(fs.doc('settings/main'),SEED.settings); await b.commit(); }
      }catch(e){ if(e.code==='permission-denied'){ showLogin('Račun '+u.email+' nima dostopa. Prosi lastnika, da te doda.', true); return; } }
      res(fs);
    });
  });
}
async function boot(){
  try{ db = await getFirebaseDb(); }catch(e){ db=null; }
  if(!db){ S.mode='local'; localLoad(); S.loaded={events:true,catalog:true,suppliers:true,settings:true,menus:true}; render(); }
  else {
    S.mode='db';
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        const next={};
        snap.docs.forEach(d=>{
          const key=col+'/'+d.id;
          next[d.id] = pending.has(key) && S[col][d.id] ? S[col][d.id] : clone(d.data());
        });
        // keep local docs that are still waiting to be written
        for(const [key] of pending){ const [c,id]=key.split('/'); if(c===col && S[col][id] && !next[id]) next[id]=S[col][id]; }
        S[col]=next; S.loaded[col]=true; scheduleRender();
      }, err=>{ S.loaded[col]=true; handleDbError(err); scheduleRender(); });
    });
    db.doc('settings/main').onSnapshot(snap=>{
      if(!pending.has('settings/main')){
        const d = snap.exists ? snap.data() : {};
        S.settings = {...clone(DEFAULT_SETTINGS), ...clone(d||{}), appetite:{...DEFAULT_SETTINGS.appetite, ...((d&&d.appetite)||{})}};
      }
      S.loaded.settings=true; scheduleRender();
    }, err=>{ S.loaded.settings=true; scheduleRender(); });
    render();
  }
  try{ sample = await window.claude?.use?.('sample') ?? null; }catch(e){ sample=null; }
  try{ downloads = await window.claude?.use?.('downloads') ?? null; }catch(e){ downloads=null; }
  scheduleRender();
}

/* ---------- calculations ---------- */
function prodOf(it){
  const live = S.catalog[it.pid];
  const p = {...(it.snap||{}), ...(live||{})};
  p.exists = !!live;
  p.cat = p.cat || 'meso'; p.unit = p.unit || 'kg';
  return normP(p);
}
function suggestion(p){
  const h = (p.history||[]).filter(x=>Number.isFinite(x.v) && x.v>0);
  if(!h.length) return null;
  const avg = h.reduce((a,x)=>a+x.v,0)/h.length;
  return { v: p.unit==='kg' ? Math.round(avg/5)*5 : Math.round(avg*100)/100, n:h.length };
}
function sellOf(p){
  if(num(p.sell)>0) return num(p.sell);
  if(p.cat==='storitve') return num(p.price)*(1+num(S.settings.markupPct)/100);
  return perPerson([{pid:p.pid||'',snap:p}]).cost*(1+num(S.settings.markupPct)/100);
}
function menuBase(m,guests){
  const tiers=(m.tiers||[]).filter(t=>num(t.min)>0&&num(t.price)>0).sort((a,b)=>num(a.min)-num(b.min));
  let price=num(m.price);
  tiers.forEach(t=>{ if(guests>=num(t.min)) price=num(t.price); });
  if(price>0) return price;
  return (m.items||[]).filter(x=>S.catalog[x.pid]).reduce((a,x)=>a+sellOf({...S.catalog[x.pid],pid:x.pid}),0);
}
function calc(ev){
  const st=S.settings;
  const apF = num((st.appetite||{})[ev.appetite||'obicajen'] ?? 1) || 1;
  const adults=num(ev.adults), kids=num(ev.children), veg=Math.min(num(ev.vegetarians), adults);
  const cf=num(st.childFactor);
  const meatP = Math.max(0, adults-veg) + kids*cf;
  const allP = adults + kids*cf;
  const reservePct = (ev.reservePct===undefined||ev.reservePct===null||ev.reservePct==='') ? num(st.reservePct) : num(ev.reservePct);
  const R = 1 + reservePct/100;
  const lines=[]; let meatKg=0;
  const items = ev.items||[];
  const build = (it,i) => {
    const p = prodOf(it);
    const gpp = (it.gpp===undefined||it.gpp===null||it.gpp==='') ? num(p.gpp) : num(it.gpp);
    const bone = num(p.bonePct);
    let persons=0, factor=1, need=0;
    if(p.cat==='storitve'){ const q=p.unit==='os'?adults+kids:1; return { i, it, p, name:p.name||'(izbrisano)', cat:p.cat, unit:p.unit, svc:true, gpp:0, bone:0, persons:0, factor:1, need:q, order:q, pack:0, price:num(p.price), cost:q*num(p.price), supplierId:'' }; }
    if(p.perMeat){ need = meatKg * gpp; }
    else {
      persons = p.cat==='meso' ? meatP : allP;
      factor = (p.cat==='meso'||p.cat==='priloge') ? apF : 1;
      if(p.unit==='kg') need = gpp*factor*persons*(1+bone/100)/1000*R;
      else need = gpp*factor*persons*R;
    }
    const pack = num(p.pack);
    let order;
    if(pack>0) order = Math.ceil(need/pack - 1e-9)*pack;
    else if(p.unit==='kos') order = Math.ceil(need - 1e-9);
    else order = Math.ceil(need*10 - 1e-9)/10;
    if(need<=0) order=0;
    const price=num(p.price);
    const l = { i, it, p, name:p.name||'(izbrisan artikel)', cat:p.cat, unit:p.perMeat?'kg':p.unit, perMeat:p.perMeat, gpp, bone, persons, factor, need, order, pack, price, cost:order*price, supplierId:p.supplierId||'' };
    if(p.cat==='meso' && p.unit==='kg') meatKg += need;
    return l;
  };
  items.forEach((it,i)=>{ if(!prodOf(it).perMeat) lines[i]=build(it,i); });
  items.forEach((it,i)=>{ if(prodOf(it).perMeat) lines[i]=build(it,i); });
  const foodCost = lines.reduce((a,l)=>a+l.cost,0);
  const drinksCost = lines.filter(l=>l.cat==='pijaca').reduce((a,l)=>a+l.cost,0);
  const extras = (ev.extras||[]).reduce((a,x)=>a+num(x.amount),0);
  const totalCost = foodCost + extras;
  const billing = adults + kids*num(st.childPriceFactor);
  const pr = ev.pricing||{};
  const mode = (pr.mode==='perGuest' && num(pr.perGuest)>0) ? 'perGuest' : 'auto';
  const markup = num(st.markupPct);
  const vF=num(st.vatFood)/100, vD=num(st.vatDrinks)/100;
  const guests=adults+kids;
  const menu = ev.menuId && S.menus[ev.menuId];
  const menuSet=new Set(menu?(menu.items||[]).map(x=>x.pid):[]);
  let basePP=0, addPP=0, addVat=0, flat=0, flatVat=0; const addList=[];
  if(menu){ basePP=menuBase(menu,guests); }
  items.forEach(it=>{ if(menu&&menuSet.has(it.pid)) return; const p=prodOf(it); if(!p.exists) return; const sv=sellOf(p); const r=p.cat==='pijaca'?vD:vF;
    if(p.cat==='storitve'&&p.unit!=='os'){ flat+=sv; flatVat+=sv*r; addList.push({p,sv,flat:true}); } else { addPP+=sv; addVat+=sv*r; addList.push({p,sv}); } });
  const suggested=Math.max(0,basePP+addPP);
  const ppNeto = mode==='perGuest' ? num(pr.perGuest) : suggested;
  const ppVat = mode==='perGuest' ? ppNeto*vF : basePP*vF+addVat;
  const neto = ppNeto*billing + flat;
  const vat = ppVat*billing + flatVat;
  const vatRate = neto>0 ? vat/neto : vF;
  const profit = neto-totalCost;
  const bySup = {};
  lines.forEach(l=>{ if(!l) return; (bySup[l.supplierId] ||= []).push(l); });
  const meatOrderKg = lines.filter(l=>l && l.cat==='meso' && l.unit==='kg').reduce((a,l)=>a+l.order,0);
  const meatPieces = lines.filter(l=>l && l.cat==='meso' && l.unit==='kos').reduce((a,l)=>a+l.order,0);
  return { adults,kids,veg,meatP,allP,reservePct,apF,lines,meatKg,meatOrderKg,meatPieces,foodCost,drinksCost,extras,totalCost,billing,mode,markup,neto,vat,vatRate,bruto:neto+vat,profit,
    marginOfPrice: neto>0 ? profit/neto : 0, markupReal: totalCost>0 ? profit/totalCost : 0,
    perGuest: ppNeto, perGuestBr: ppNeto+ppVat, basePP, baseBr: basePP*(1+vF), addPP, addBr: addPP+addVat, flat, flatBr: flat+flatVat, addList, guests, costPerGuest: billing>0 ? totalCost/billing : 0, suggested, bySup };
}

/* ---------- text builders ---------- */
function orderText(ev,c,supId){
  const sup=S.suppliers[supId]; const st=S.settings;
  const rows=(c.bySup[supId]||[]).filter(l=>l.order>0);
  const pick=(ev.pickup||{})[supId]||'';
  let t=`Pozdravljeni${sup&&sup.contactName?' '+sup.contactName:''},\n\nza dogodek ${ev.date?fmtDate(ev.date):''} bi naročil/a:\n`;
  rows.forEach(l=>{ t+=`• ${l.name}: ${qty(l.order,l.unit)}${l.pack>0?` (${nf(l.order/l.pack,0)} × ${qty(l.pack,l.unit)})`:''}\n`; });
  if(pick) t+=`\nPrevzem / dostava: ${pick}\n`;
  t+=`\nHvala in lep pozdrav,\n${st.signature||st.company||''}`;
  return t.trim();
}
function menuText(c){
  const by={}; c.lines.forEach(l=>{ if(l && l.order>0 && !l.perMeat) (by[l.cat] ||= []).push(l.name); });
  return Object.keys(CATS).filter(k=>by[k]).map(k=>`${CATS[k]}: ${by[k].join(', ')}`).join('\n');
}
function menuBlock(ev,c){
  const m=ev.menuId&&S.menus[ev.menuId];
  const names=it=>prodOf(it).name;
  const its=(ev.items||[]).filter(it=>!prodOf(it).perMeat);
  if(!m) return ['Meni:', menuText(c)];
  const set=new Set((m.items||[]).map(x=>x.pid));
  const inc=its.filter(it=>set.has(it.pid)).map(names), add=its.filter(it=>!set.has(it.pid)).map(names);
  return [`Meni: ${m.name}`, inc.length?`V meniju: ${inc.join(', ')}`:'', add.length?`Dodatno: ${add.join(', ')}`:''];
}
function offerText(ev,c){
  const st=S.settings;
  return [
    `PONUDBA – ${ev.name||'dogodek'}`,
    ev.client?`Naročnik: ${ev.client}`:'', `Datum: ${fmtDate(ev.date)}`, ev.location?`Lokacija: ${ev.location}`:'',
    `Gostje: ${c.adults} odraslih${c.kids?`, ${c.kids} otrok`:''}${c.veg?` (od tega ${c.veg} brez mesa)`:''}`,
    '', ...menuBlock(ev,c), '',
    `Cena na osebo: ${eur(c.perGuestBr)} z DDV (${eur(c.perGuest)} + DDV)`, c.flat?`Storitve (na dogodek): ${eur(c.flatBr)} z DDV`:'',
    c.kids?`Cena na otroka: ${eur(c.billing>0?c.neto/c.billing*num(st.childPriceFactor):0)} + DDV`:'',
    `Skupaj brez DDV: ${eur(c.neto)}`, `DDV: ${eur(c.vat)}`, `Skupaj z DDV: ${eur(c.bruto)}`,
    '', st.signature||st.company||''
  ].filter((x,i,a)=>x!=='' || (a[i-1]!=='' )).join('\n').trim();
}

function scheduleRender(){

  const a=document.activeElement; let focus=null;
  if(a && a.id && $app.contains(a)){ focus={id:a.id, val:a.value, s:a.selectionStart, e:a.selectionEnd, type:a.type}; }
  const sy=window.scrollY;
  $app.innerHTML = topBar() + `<div class="wrap" style="padding-top:18px">${banner()}${viewBody()}</div>`;
  if(focus){
    const el=document.getElementById(focus.id);
    if(el){ if(el.tagName!=='SELECT' && focus.type!=='checkbox' && (Date.now()-lastInput<1500)) el.value=focus.val; el.focus({preventScroll:true}); try{ if(focus.s!=null) el.setSelectionRange(focus.s,focus.e); }catch(e){} }
  }
  window.scrollTo(0,sy);
}

function stepper(id,f,label,val){
  return `<div class="stepper"><label for="${id}">${label}</label><div class="stepper-in">
    <button type="button" class="stp" data-act="step" data-f="${f}" data-d="-1" aria-label="${label} manj">−</button>
    <input id="${id}" class="in num-in" inputmode="numeric" data-k="ev.${f}" value="${inVal(val||0)}">
    <button type="button" class="stp" data-act="step" data-f="${f}" data-d="1" aria-label="${label} več">+</button></div></div>`;
}
function liveList(ev,c){
  const items=ev.items||[], st=S.settings;
  const inEv=new Set(items.map(x=>x.pid));
  const m=ev.menuId&&S.menus[ev.menuId];
  const menuSet=new Set(m?(m.items||[]).map(x=>x.pid).filter(pid=>S.catalog[pid]):[]);
  const br=(pid)=>{ const p=normP({...S.catalog[pid],pid}); const r=(p.cat==='pijaca'?num(st.vatDrinks):num(st.vatFood))/100; return sellOf(p)*(1+r); };
  const row=(pid,label)=>{ const p=S.catalog[pid]; const on=inEv.has(pid);
    return `<button type="button" class="cl-row" aria-pressed="${on}" data-act="evPick" data-id="${pid}"><span class="cl-box">${CHECK}</span><span class="cl-name">${esc(p.name)}</span><span class="cl-price">${label(on)}</span></button>`; };
  let html='';
  if(m){
    const inMenu=[...menuSet].sort((a,b)=>Object.keys(CATS).indexOf(normP({...S.catalog[a]}).cat)-Object.keys(CATS).indexOf(normP({...S.catalog[b]}).cat));
    html+=`<div class="cl-group"><div class="cl-cat">V meniju »${esc(m.name)}«</div>${inMenu.map(pid=>row(pid,on=>on?'<span class="incl">vključeno</span>':'<span class="muted small">ni izbrano</span>')).join('')}</div>`;
  }
  const rest=Object.keys(CATS).map(cat=>{
    const ps=Object.entries(S.catalog).filter(([pid,p])=>!menuSet.has(pid)&&normP({...p}).cat===cat).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
    if(!ps.length) return '';
    return `<div class="cl-group"><div class="cl-cat">${m?'Dodatno · ':''}${CATS[cat]}</div>${ps.map(([pid,p])=>row(pid,on=>`${on?'':'+ '}${eur(br(pid))}${p.cat==='storitve'&&p.unit!=='os'?'<span class="small muted"> /dog.</span>':'<span class="small muted"> /os</span>'}`)).join('')}</div>`;
  }).join('');
  return html+rest;
}

function listText(rows){ return rows.filter(l=>l.order>0).map(l=>`${l.name} – ${qty(l.order,l.unit)}`).join('\n'); }
function orderRows(c){ const order=Object.keys(CATS); return c.lines.filter(l=>l&&l.order>0&&!l.svc).sort((x,y)=>order.indexOf(x.cat)-order.indexOf(y.cat)); }

/* ----- checklist ----- */
const CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
function vatOf(p){ const st=S.settings; return (normP({...p}).cat==='pijaca'?num(st.vatDrinks):num(st.vatFood))/100; }
function ppDelta(items,pid,apF=1){
  const has=items.some(it=>it.pid===pid);
  if(has) return perPerson(items,apF).by[pid]||0;
  const without=items.filter(it=>it.pid!==pid);
  const withIt=has?items:[...items,{pid}];
  return perPerson(withIt,apF).cost-perPerson(without,apF).cost;
}
function checklist(items,attrs,apF=1){
  const set=new Set(items.map(x=>x.pid)); const mk=1+num(S.settings.markupPct)/100;
  return Object.keys(CATS).map(cat=>{
    const ps=Object.entries(S.catalog).filter(([,p])=>normP({...p}).cat===cat).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
    if(!ps.length) return '';
    return `<div class="cl-group"><div class="cl-cat">${CATS[cat]}</div>${ps.map(([pid,p])=>{ const on=set.has(pid); const d=ppDelta(items,pid,apF)*mk*(1+vatOf(p));
      return `<button type="button" class="cl-row" aria-pressed="${on}" ${attrs(pid)}><span class="cl-box">${CHECK}</span><span class="cl-name">${esc(p.name)}</span><span class="cl-price">${on?'':'+ '}${eur(d)}</span></button>`;}).join('')}</div>`;
  }).join('');
}

/* ----- menus ----- */
function perPerson(items,apF=1){
  const st=S.settings, R=1+num(st.reservePct)/100; let meatKg=0, cost=0, drinks=0;
  const ps=(items||[]).map(it=>({it,p:prodOf(it)})).filter(x=>(x.p.exists||x.it.snap)&&x.p.cat!=='storitve');
  const g=(it,p)=>(it.gpp===undefined||it.gpp===null||it.gpp==='')?num(p.gpp):num(it.gpp);
  const by={};
  ps.forEach(({it,p})=>{ if(p.perMeat) return; const af=(p.cat==='meso'||p.cat==='priloge')?apF:1; const need=(p.unit==='kg'? g(it,p)*(1+num(p.bonePct)/100)/1000*R : g(it,p)*R)*af; if(p.cat==='meso'&&p.unit==='kg') meatKg+=need; const c=need*num(p.price); cost+=c; by[it.pid]=c; if(p.cat==='pijaca') drinks+=c; });
  ps.forEach(({it,p})=>{ if(p.perMeat){ const c=meatKg*g(it,p)*num(p.price); cost+=c; by[it.pid]=c; } });
  const ds=cost>0?drinks/cost:0;
  return { cost, by, vatRate:(ds*num(st.vatDrinks)+(1-ds)*num(st.vatFood))/100 };
}
function menuPrice(m){
  const pp=perPerson(m.items), fixed=num(m.price)>0;
  const neto=fixed?num(m.price):pp.cost*(1+num(S.settings.markupPct)/100);
  return { ...pp, fixed, neto, bruto:neto*(1+pp.vatRate), suggested:pp.cost*(1+num(S.settings.markupPct)/100), margin: neto>0?(neto-pp.cost)/neto:0 };
}
function menusView(){
  const list=Object.entries(S.menus).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  const vF=1+num(S.settings.vatFood)/100;
  const cards=list.map(([id,m])=>{
    const sel=new Set((m.items||[]).map(it=>it.pid)); const confirm=S.ui.confirm==='menu:'+id;
    const cost=perPerson(m.items||[]).cost; const base=menuBase(m,0);
    const groups=Object.keys(CATS).filter(c=>c!=='storitve').map(cat=>{
      const ps=Object.entries(S.catalog).filter(([,p])=>normP({...p}).cat===cat).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
      if(!ps.length) return '';

function applyMenu(ev,mid){
  const m=S.menus[mid]; if(!m) return;
  const items=(m.items||[]).filter(it=>S.catalog[it.pid]).map(it=>({...itemFromPid(it.pid), ...(it.gpp!=null&&it.gpp!==''?{gpp:it.gpp}:{})}));
  ev.menuId=mid; ev.items=items; ev.after=undefined;
  ev.cats=[...new Set(items.map(it=>prodOf(it).cat))];
  ev.pricing = {mode:'auto'};
}
function menuModified(ev){
  const m=S.menus[ev.menuId]; if(!m) return false;
  const a=(m.items||[]).map(x=>x.pid).filter(pid=>S.catalog[pid]).sort().join(), b=(ev.items||[]).map(x=>x.pid).sort().join();
  return a!==b;
}

/* ---------- mutations ---------- */
function curEv(){ return S.events[S.view.id] || (S.draft&&S.draft.id===S.view.id?S.draft.ev:null); }
function touchEv(){ const ev=curEv(); if(!ev) return; if(S.draft&&S.draft.id===S.view.id){ saveDraft(); return; } ev.updatedAt=new Date().toISOString(); saveLater('events',S.view.id); }
function setK(el){
  const k=el.dataset.k; const v = el.type==='checkbox' ? el.checked : el.value;
  const ev=curEv(); const i=+el.dataset.i;
  if(k.startsWith('ev.')){
    const f=k.slice(3);
    if(f==='pickup'){ ev.pickup=ev.pickup||{}; ev.pickup[el.dataset.sid]=v; }
    else if(['adults','children','vegetarians'].includes(f)){ ev[f]=Math.max(0,Math.round(num(v))); if(f==='vegetarians') ev[f]=Math.min(ev[f],num(ev.adults)); }
    else if(f==='reservePct') ev[f]= v.trim()===''? null : num(v);
    else ev[f]=v;
    touchEv(); return;
  }
  if(k==='item.gpp'){ ev.items[i].gpp=Math.max(0,num(v)); touchEv(); return; }
  if(k==='extra.label'){ ev.extras[i].label=v; touchEv(); return; }
  if(k==='extra.amount'){ ev.extras[i].amount=Math.max(0,num(v)); touchEv(); return; }
  if(k==='pr.markupPct'){ ev.pricing={...(ev.pricing||{}),mode:'markup',markupPct:num(v)}; touchEv(); return; }
  if(k==='pr.perGuest'){ const x=Math.max(0,num(v)); ev.pricing = (String(v).trim()===''||x<=0) ? {mode:'auto'} : {mode:'perGuest',perGuest:x}; touchEv(); return; }
  if(k.startsWith('after.')){
    ev.after=ev.after||{items:{}}; ev.after.items=ev.after.items||{};
    if(k==='after.notes') ev.after.notes=v;
    else { const x=ev.after.items[i]=ev.after.items[i]||{}; if(k==='after.left') x.left= v===''?null:num(v); else x.out=!!v; }
    touchEv(); return;
  }
  if(k.startsWith('cat.')){
    const id=el.dataset.id, p=S.catalog[id]; if(!p) return; const f=k.slice(4);
    p[f] = ['gpp','bonePct','price','pack','sell'].includes(f) ? Math.max(0,num(v)) : v;
    if(f==='cat'){ if(v==='storitve'&&!SVC_UNITS[p.unit]) p.unit='dog'; if(v!=='storitve'&&SVC_UNITS[p.unit]) p.unit='kg'; render(); }
    saveLater('catalog',id); return;
  }
  if(k==='menu.tmin'||k==='menu.tprice'){ const m=S.menus[el.dataset.id]; if(!m) return; const t=(m.tiers||[])[i]; if(!t) return; if(k==='menu.tmin') t.min=Math.max(0,Math.round(num(v))); else t.price=Math.max(0,num(v)); saveLater('menus',el.dataset.id); return; }
  if(k.startsWith('menu.')){ const id=el.dataset.id, m=S.menus[id]; if(!m) return; const f=k.slice(5); m[f]= f==='price' ? (String(v).trim()===''||num(v)<=0?null:num(v)) : v; saveLater('menus',id); return; }
  if(k.startsWith('sup.')){ const id=el.dataset.id; if(!S.suppliers[id]) return; S.suppliers[id][k.slice(4)]=v; saveLater('suppliers',id); return; }
  if(k.startsWith('set.')){
    const f=k.slice(4);
    if(f.startsWith('appetite.')) S.settings.appetite[f.slice(9)]=Math.max(0,num(v));
    else S.settings[f] = ['company','signature'].includes(f) ? v : Math.max(0,num(v));
    saveLater('settings','main'); return;
  }
}
function newEvent(data={}){
  const id=uid();
  if(S.draft){ S.view={name:'event',id:S.draft.id}; saveView(); render(); toast('Najprej shrani ali zavrzi nedokončan dogodek.'); return; }
  S.draft={id, ev:{ name:'', date:'', client:'', location:'', status:'povprasevanje', adults:0, children:0, vegetarians:0, appetite:'obicajen', reservePct:null, items:[], extras:[], pricing:{mode:'auto'}, createdAt:new Date().toISOString(), ...data }}; saveDraft();
  S.view={name:'event',id,tab:'ponudba'}; saveView(); render(); window.scrollTo(0,0);
}
function itemFromPid(pid){ const p=S.catalog[pid]; return { pid, snap:{name:p.name,cat:p.cat,unit:p.unit,gpp:p.gpp,bonePct:p.bonePct,price:p.price,pack:p.pack,supplierId:p.supplierId} }; }
function learn(){
  const ev=curEv(), c=calc(ev), a=ev.after||{items:{}}; let n=0;
  c.lines.forEach(l=>{
    if(!l||l.perMeat||!l.p.exists) return;
    const x=(a.items||{})[l.i]; if(!x || (x.left==null && !x.out)) return;
    const persons=l.persons*l.factor; if(!persons) return;
    const consumed=Math.max(0, l.order-num(x.left));
    let v = l.unit==='kg' ? consumed*1000/(1+l.bone/100)/persons : consumed/persons;
    if(x.out) v*=1.15;
    const p=S.catalog[l.it.pid]; const h=(p.history||[]).filter(e=>e.ev!==S.view.id);
    h.push({ev:S.view.id, date:ev.date||today(), v:Math.round(v*100)/100, out:!!x.out});
    p.history=h.slice(-8); saveLater('catalog',l.it.pid); n++;
  });
  ev.after={...a, learnedAt:new Date().toISOString()};
  if(!['obracunano'].includes(ev.status)) ev.status='izvedeno';
  touchEv(); render(); toast(n?`Učenje shranjeno za ${n} artiklov.`:'Ni vpisanih ostankov.');
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Kopirano'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); toast(ok?'Kopirano':'Kopiranje ni uspelo'); }
}
async function copyFrom(id){
  const el=document.getElementById(id); if(!el) return;
  try{ await navigator.clipboard.writeText(el.value); toast('Kopirano'); }
  catch(e){ el.focus(); el.select(); toast('Označeno – kopiraj s Ctrl/Cmd + C'); }
}
async function save(filename,data){
  if(!downloads) return;
  try{ await downloads.save({filename,data}); }
  catch(e){ if(e&&e.code!=='declined') toast('Prenos ni uspel.'); }
}
function safeName(s){ return (s||'dogodek').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'dogodek'; }

function quickCreate(){
  const q=quickState();
  if(num(q.adults)+num(q.children)<=0){ toast('Vpiši število gostov.'); document.getElementById('q-adults')?.focus(); return; }
  const cats=Object.keys(CATS).filter(c=>q.cats.includes(c));
  S.settings.quickCats=cats; saveLater('settings','main');
  const data={ name:q.name.trim()||'Nov dogodek', date:q.date||'', client:q.client.trim(), location:'',
    adults:Math.max(0,Math.round(num(q.adults))), children:Math.max(0,Math.round(num(q.children))), cats, items:[] };
  const mid=q.menuId&&S.menus[q.menuId]?q.menuId:null;
  S.ui.quick=null;
  if(mid){ applyMenu(data,mid); }
  newEvent(data); toast(mid?'Osnutek ustvarjen z menijem.':'Osnutek ustvarjen – odkljukaj artikle.');
}

/* ---------- date picker ---------- */
const X_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const CAL_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const $dp=document.getElementById('dp'), $dpb=document.getElementById('dp-back');
const DP={t:null, sel:'', y:0, m:0, anchor:null};
const ymd=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function dpOpen(t,btn){
  const cur = t==='q' ? quickState().date : (curEv()?.date||'');
  const base = cur ? new Date(cur+'T12:00:00') : new Date();
  Object.assign(DP,{t, sel:cur, y:base.getFullYear(), m:base.getMonth(), anchor:btn.id});
  dpRender(); $dp.hidden=false; $dpb.hidden=false;
  const r=btn.getBoundingClientRect(); const h=$dp.offsetHeight;
  let top=r.bottom+6; if(top+h>innerHeight-8) top=Math.max(8,r.top-h-6);
  $dp.style.top=top+'px'; $dp.style.left=Math.max(16,Math.min(r.left, innerWidth-$dp.offsetWidth-16))+'px';
  ($dp.querySelector('[aria-pressed="true"]')||$dp.querySelector('.dp-day.today')||$dp.querySelector('.dp-day'))?.focus();
}
function dpClose(){ $dp.hidden=true; $dpb.hidden=true; const a=document.getElementById(DP.anchor); a&&a.focus(); }
function dpApply(){
  if(DP.t==='q') quickState().date=DP.sel;
  else { const ev=curEv(); if(ev){ ev.date=DP.sel; touchEv(); } }
  $dp.hidden=true; $dpb.hidden=true; render(); document.getElementById(DP.anchor)?.focus();
}
function dpRender(){
  const first=new Date(DP.y,DP.m,1), start=(first.getDay()+6)%7, days=new Date(DP.y,DP.m+1,0).getDate(), prevDays=new Date(DP.y,DP.m,0).getDate();
  const td=today(); let cells='';
  for(let i=0;i<42;i++){
    let y=DP.y,m=DP.m,d=i-start+1,out=false;
    if(d<1){ m--; d=prevDays+d; out=true; } else if(d>days){ m++; d=d-days; out=true; }
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    const v=ymd(y,m,d);
    cells+=`<button type="button" class="dp-day${out?' out':''}${v===td?' today':''}" data-dp="pick" data-v="${v}" aria-pressed="${v===DP.sel}" aria-label="${new Date(v+'T12:00:00').toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}">${d}</button>`;
  }
  const title=first.toLocaleDateString('sl-SI',{month:'long',year:'numeric'});
  $dp.innerHTML=`<div class="dp-head"><button type="button" class="icon-btn" data-dp="prev" aria-label="Prejšnji mesec"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button><b>${title}</b><button type="button" class="icon-btn" data-dp="next" aria-label="Naslednji mesec"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
  <div class="dp-grid">${['pon','tor','sre','čet','pet','sob','ned'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div>
  <div class="small muted" style="min-height:18px">${DP.sel?esc(fmtDate(DP.sel)):'Ni izbranega datuma'}</div>
  <div class="dp-foot"><div class="row" style="gap:6px"><button type="button" class="btn sm quiet" data-dp="today">Danes</button>${DP.sel?'<button type="button" class="btn sm quiet" data-dp="clear">Počisti</button>':''}</div>
  <div class="row" style="gap:6px"><button type="button" class="btn sm quiet" data-dp="cancel">Prekliči</button><button type="button" class="btn sm" data-dp="ok">Izberi</button></div></div>`;
}
$dp.addEventListener('click',e=>{
  const b=e.target.closest('[data-dp]'); if(!b) return; const a=b.dataset.dp;
  const move=n=>{ DP.m+=n; if(DP.m<0){DP.m=11;DP.y--;} if(DP.m>11){DP.m=0;DP.y++;} dpRender(); };
  if(a==='prev') move(-1); else if(a==='next') move(1);
  else if(a==='pick'){ DP.sel=b.dataset.v; const d=new Date(DP.sel+'T12:00:00'); DP.y=d.getFullYear(); DP.m=d.getMonth(); dpRender(); $dp.querySelector('[aria-pressed="true"]')?.focus(); }
  else if(a==='today'){ DP.sel=today(); const d=new Date(); DP.y=d.getFullYear(); DP.m=d.getMonth(); dpRender(); }
  else if(a==='clear'){ DP.sel=''; dpRender(); }
  else if(a==='cancel') dpClose();
  else if(a==='ok') dpApply();
});
$dp.addEventListener('dblclick',e=>{ const b=e.target.closest('[data-dp="pick"]'); if(b){ DP.sel=b.dataset.v; dpApply(); } });
$dp.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); dpClose(); } else if(e.key==='Enter' && e.target.dataset.dp==='pick'){ e.preventDefault(); DP.sel=e.target.dataset.v; dpApply(); } });
$dpb.addEventListener('click',dpClose);

/* ---------- AI ---------- */
function aiMsg(code){
  return ({not_granted:'Uporaba AI ni dovoljena v tem pogledu.',rate_limited:'Preveč zahtev – poskusi čez minuto.',invalid_json:'Odgovora nisem razumela – poskusi s krajšim opisom.',refused:'Tega opisa ne morem obdelati.',session_expired:'Prijava je potekla – osveži stran.'})[code]||'AI trenutno ni na voljo – poskusi znova.';
}
async function aiEvent(){
  const desc=(document.getElementById('ai-desc')?.value||'').trim(); S.ui.aiDraft=desc;
  if(!desc){ S.ui.aiErr='Najprej opiši dogodek.'; render(); return; }
  S.ui.aiBusy=true; S.ui.aiErr=''; render();
  const cat=Object.entries(S.catalog).map(([id,p])=>`${id}: ${p.name} (${CATS[p.cat]||p.cat}, ${p.unit})`).join('\n');
  const prompt=`Si tajnica organizatorja pogostitev in piknikov v Sloveniji. Iz opisa pripravi osnutek dogodka.
Današnji datum: ${today()}.
Cenik (id: ime):
${cat||'(prazen)'}

Opis dogodka:
"""${desc.slice(0,4000)}"""

Vrni SAMO JSON objekt te oblike:
{"name":"kratko ime dogodka","date":"YYYY-MM-DD ali prazno","client":"","location":"","adults":0,"children":0,"vegetarians":0,"appetite":"lahek|obicajen|lacni","productIds":["id iz cenika"],"notes":"kar ne sodi drugam"}
Pravila: productIds naj vsebuje samo id-je iz cenika, ki ustrezajo opisu; če meni ni naveden, izberi razumno osnovo za žar (meso + priloge + drugo). Ne izmišljuj si podatkov, ki jih ni v opisu – pusti prazno ali 0.`;
  try{
    const r=await sample.json(prompt,{modelTier:'quick'});
    const ids=(Array.isArray(r?.productIds)?r.productIds:[]).map(String).filter(id=>S.catalog[id]);
    const data={ name:String(r?.name||'Nov dogodek').slice(0,120), date:/^\d{4}-\d{2}-\d{2}$/.test(r?.date||'')?r.date:'', client:String(r?.client||''), location:String(r?.location||''),
      adults:Math.max(0,Math.round(num(r?.adults))), children:Math.max(0,Math.round(num(r?.children))), vegetarians:Math.max(0,Math.round(num(r?.vegetarians))),
      appetite:APPETITE[r?.appetite]?r.appetite:'obicajen', notes:[String(r?.notes||''),'Opis: '+desc].filter(Boolean).join('\n\n'), items:ids.map(itemFromPid) };
    S.ui.aiBusy=false; S.ui.aiDraft=''; newEvent(data); toast('Osnutek pripravljen – preveri gramature.');
  }catch(e){ S.ui.aiBusy=false; S.ui.aiErr=aiMsg(e&&e.code); render(); }
}
async function aiOffer(){
  const ev=curEv(), c=calc(ev), st=S.settings;
  S.ui.offerBusy=true; S.ui.offerErr=''; render();
  const prompt=`Napiši kratko, prijazno ponudbo (e-pošto) v slovenščini za pogostitev. Uporabi SAMO spodnje podatke, ne dodajaj cen ali storitev, ki jih ni. Brez markdowna, navaden tekst, z nagovorom in podpisom.
Dogodek: ${ev.name||''}
Naročnik: ${ev.client||'(neznan)'}
Datum: ${fmtDate(ev.date)}
Lokacija: ${ev.location||'(ni navedena)'}
Gostje: ${c.adults} odraslih, ${c.kids} otrok, od tega ${c.veg} brez mesa
Meni:
${menuText(c)}
Cena na odraslega brez DDV: ${eur(c.perGuest)}; na otroka: ${eur(c.perGuest*num(st.childPriceFactor))}
Skupaj brez DDV: ${eur(c.neto)}; DDV: ${eur(c.vat)}; skupaj z DDV: ${eur(c.bruto)}
Opombe organizatorja: ${(ev.notes||'').slice(0,1500)}
Podpis: ${st.signature||st.company||''}`;
  try{
    const r=await sample(prompt,{modelTier:'default',cache:false});
    ev.offerText=r.text.trim(); S.ui.offerBusy=false; touchEv(); render(); toast('Ponudba napisana.');
  }catch(e){ S.ui.offerBusy=false; S.ui.offerErr=aiMsg(e&&e.code); render(); }
}

/* ---------- events ---------- */
$app.addEventListener('input', e=>{ const el=e.target; if(el.dataset.q){ quickState()[el.dataset.q]=el.value; lastInput=Date.now(); if(el.dataset.q==='adults'||el.dataset.q==='children') scheduleRender(); return; } if(!el.dataset.k) return; lastInput=Date.now(); setK(el); if(el.tagName!=='SELECT' && el.type!=='checkbox' && el.type!=='date') scheduleRender(); });
$app.addEventListener('change', e=>{ const el=e.target;
  if(el.id==='import-file' && el.files && el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.catalog) throw 0; S.settings={...clone(DEFAULT_SETTINGS),...(d.settings||{})}; S.catalog=d.catalog||{}; S.menus=d.menus||{}; S.events=d.events||{}; if(db){ Object.keys(S.catalog).forEach(id=>flush('catalog',id)); Object.keys(S.menus).forEach(id=>flush('menus',id)); Object.keys(S.events).forEach(id=>flush('events',id)); flush('settings','main'); } else localPersist(); render(); toast('Podatki uvoženi.'); }catch(_){ toast('Ta datoteka ni FRASEK kopija.'); } }; r.readAsText(el.files[0]); el.value=''; return; } if(!el.dataset.k) return; setK(el); if(el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date'){ lastInput=0; render(); } });
$app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, ev=curEv();
  const go=v=>{ S.view=v; S.ui.confirm=null; saveView(); render(); window.scrollTo(0,0); };
  switch(act){
    case 'nav': go({name:b.dataset.to}); break;
    case 'openDraft': if(S.draft) go({name:'event',id:S.draft.id}); break;
    case 'discardDraft': S.draft=null; saveDraft(); go({name:'events'}); toast('Osnutek zavržen.'); break;
    case 'createEvent': { const c=calc(ev); if(!c.adults&&!c.kids){ toast('Najprej vpiši število gostov.'); document.getElementById('ev-adults')?.focus(); break; } if(!(ev.items||[]).length&&!ev.menuId){ toast('Izberi meni ali jedi.'); break; } const id=S.draft.id; ev.name=ev.name||'Dogodek '+(ev.date?fmtDate(ev.date):new Date().toLocaleDateString('sl-SI')); S.events[id]=ev; S.draft=null; saveDraft(); saveLater('events',id,10); go({name:'events'}); toast('Dogodek ustvarjen.'); break; }
    case 'saveEvent': { for(const [key,t] of pending){ clearTimeout(t); const [cc,id]=key.split('/'); flush(cc,id); } go({name:'events'}); toast('Shranjeno.'); break; }
    case 'dp': dpOpen(b.dataset.t,b); break;
    case 'login': { const pv=new firebase.auth.GoogleAuthProvider(); fbAuth.signInWithPopup(pv).catch(e=>{ if(/popup|operation-not-supported|web-storage/.test(e.code||'')) fbAuth.signInWithRedirect(pv); else showLogin('Prijava ni uspela: '+(e.message||e.code)); }); break; }
    case 'logout': fbAuth&&fbAuth.signOut().then(()=>location.reload()); break;
    case 'exportData': { const blob=new Blob([JSON.stringify({app:'frasek',v:1,at:new Date().toISOString(),settings:S.settings,catalog:S.catalog,menus:S.menus,events:S.events},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='frasek-podatki-'+today()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); toast('Kopija izvožena.'); break; }
    case 'adv': S.settings.advanced=!S.settings.advanced; saveLater('settings','main',10); render(); toast(S.settings.advanced?'Več možnosti vklopljeno':'Preprost način'); break;
    case 'theme': { const t=isDark()?'light':'dark'; applyTheme(t); try{ localStorage.setItem('pt-theme',t); }catch(e){} render(); break; }
    case 'open': go({name:'event',id:b.dataset.id}); break;
    case 'tab': S.view.tab=b.dataset.tab; saveView(); render(); break;
    case 'newEvent': newEvent({name:'',adults:0}); setTimeout(()=>document.getElementById('ev-name')?.focus(),50); break;
    case 'dupEvent': { const src=clone(S.events[b.dataset.id]); delete src.after; delete src.offerText; newEvent({...src, name:(src.name||'')+' (kopija)', status:'povprasevanje', date:'', createdAt:new Date().toISOString()}); break; }
    case 'askConfirm': S.ui.confirm=b.dataset.key; render(); break;
    case 'cancelConfirm': S.ui.confirm=null; render(); break;
    case 'delEvent': removeDoc('events',b.dataset.id); go({name:'events'}); toast('Dogodek izbrisan.'); break;
    case 'appetite': ev.appetite=b.dataset.v; touchEv(); render(); break;
    case 'addItem': { const s=document.getElementById('add-item'); if(s&&s.value){ ev.items=ev.items||[]; ev.items.push(itemFromPid(s.value)); touchEv(); render(); } break; }
    case 'rmItem': { const i=+b.dataset.i; ev.items.splice(i,1); if(ev.after&&ev.after.items){ const n={}; Object.entries(ev.after.items).forEach(([k,v])=>{k=+k; if(k<i) n[k]=v; else if(k>i) n[k-1]=v;}); ev.after.items=n; } touchEv(); render(); break; }
    case 'applyItemSug': ev.items[+b.dataset.i].gpp=num(b.dataset.v); touchEv(); render(); break;
    case 'addExtra': ev.extras=ev.extras||[]; ev.extras.push({label:b.dataset.l,amount:0}); touchEv(); render(); setTimeout(()=>document.getElementById('ex-a-'+(ev.extras.length-1))?.focus(),0); break;
    case 'rmExtra': ev.extras.splice(+b.dataset.i,1); touchEv(); render(); break;
    case 'priceMode': { const c=calc(ev); ev.pricing={...(ev.pricing||{}),mode:b.dataset.v}; if(b.dataset.v==='perGuest' && !ev.pricing.perGuest) ev.pricing.perGuest=Math.round(c.perGuest*100)/100; touchEv(); render(); break; }
    case 'setStatus': ev.status=b.dataset.v; touchEv(); render(); toast('Status posodobljen.'); break;
    case 'resetOffer': delete ev.offerText; touchEv(); render(); break;
    case 'copy': copyFrom(b.dataset.src); break;
    case 'copyOffer': { copyText((S.settings.advanced&&ev.offerText)||offerText(ev,calc(ev))); break; }
    case 'step': { const f=b.dataset.f; ev[f]=Math.max(0,num(ev[f])+num(b.dataset.d)); if(f==='vegetarians') ev[f]=Math.min(ev[f],num(ev.adults)); touchEv(); render(); break; }
    case 'useSuggested': ev.pricing={mode:'auto'}; touchEv(); render(); toast('Uporabljena predlagana cena.'); break;
    case 'copyList': { copyText(listText(orderRows(calc(ev)))); break; }
    case 'dlOffer': { const t=document.getElementById('offer-txt')?.value||''; save(`ponudba-${safeName(ev.name)}.txt`, t); break; }
    case 'dlOrders': { const c=calc(ev); const rows=[['Dobavitelj','Artikel','Enota','Potrebno','Naročilo','Cena na enoto','Znesek']]; Object.entries(c.bySup).forEach(([sid,ls])=>ls.forEach(l=>rows.push([S.suppliers[sid]?.name||'Brez dobavitelja',l.name,l.unit,nf(l.need,2),nf(l.order,2),nf(l.price,2),nf(l.cost,2)]))); save(`narocila-${safeName(ev.name)}.csv`, '\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n')); break; }
    case 'learn': learn(); break;
    case 'qCat': { const q=quickState(), v=b.dataset.v; q.cats=q.cats.includes(v)?q.cats.filter(x=>x!==v):[...q.cats,v]; render(); break; }
    case 'evPick': { const pid=b.dataset.id; ev.items=ev.items||[]; const i=ev.items.findIndex(it=>it.pid===pid); if(i>=0){ ev.items.splice(i,1); if(ev.after&&ev.after.items){ const n={}; Object.entries(ev.after.items).forEach(([k,v])=>{k=+k; if(k<i) n[k]=v; else if(k>i) n[k-1]=v;}); ev.after.items=n; } } else ev.items.push(itemFromPid(pid)); touchEv(); render(); break; }
    case 'newMenu': { const id=uid(); S.menus[id]={name:'Nov meni',items:[],price:null,tiers:[]}; S.ui.openMenu=id; saveLater('menus',id,10); render(); setTimeout(()=>{const el=document.getElementById('m-n-'+id); el?.focus(); el?.select();},0); break; }
    case 'addTier': { const m=S.menus[b.dataset.id]; m.tiers=m.tiers||[]; const last=m.tiers[m.tiers.length-1]; m.tiers.push({min:last?num(last.min)+50:50, price:last?Math.max(0,num(last.price)-1):Math.max(0,num(m.price)-1)}); saveLater('menus',b.dataset.id); render(); break; }
    case 'rmTier': { const m=S.menus[b.dataset.id]; m.tiers.splice(+b.dataset.i,1); saveLater('menus',b.dataset.id); render(); break; }
    case 'delMenu': removeDoc('menus',b.dataset.id); S.ui.confirm=null; render(); break;
    case 'menuPick': { S.ui.openMenu=b.dataset.id; const m=S.menus[b.dataset.id]; if(!m) break; m.items=m.items||[]; const pid=b.dataset.pid; const i=m.items.findIndex(x=>x.pid===pid); if(i>=0) m.items.splice(i,1); else m.items.push({pid}); saveLater('menus',b.dataset.id); render(); break; }
    case 'evMenu': { const v=b.dataset.v; if(v==='custom'){ ev.menuId=null; touchEv(); render(); break; } applyMenu(ev,v); touchEv(); render();  break; }
    case 'qMenu': { const q=quickState(); q.menuId = b.dataset.v==='custom'?null:b.dataset.v; render(); break; }
    case 'evCat': { const v=b.dataset.v; ev.cats=[...(ev.cats||[]),v]; touchEv(); render(); break; }
    case 'qCreate': quickCreate(); break;
    case 'aiOffer': aiOffer(); break;
    case 'newCat': { const id=uid(); S.catalog[id]={name:'Nov artikel',cat:'meso',unit:'kg',gpp:100,bonePct:0,price:0,pack:0,supplierId:''}; saveLater('catalog',id,10); render(); setTimeout(()=>{const el=document.getElementById('c-n-'+id); el?.focus(); el?.select();},0); break; }
    case 'delCat': removeDoc('catalog',b.dataset.id); S.ui.confirm=null; render(); break;
    case 'applyCatSug': S.catalog[b.dataset.id].gpp=num(b.dataset.v); saveLater('catalog',b.dataset.id); render(); break;
    case 'newSup': { const id=uid(); S.suppliers[id]={name:'Nov dobavitelj',contactName:'',phone:'',email:'',note:''}; saveLater('suppliers',id,10); render(); setTimeout(()=>{const el=document.getElementById('s-n-'+id); el?.focus(); el?.select();},0); break; }
    case 'delSup': removeDoc('suppliers',b.dataset.id); S.ui.confirm=null; render(); break;
  }
});
window.addEventListener('pagehide', ()=>{ for(const [key,t] of pending){ clearTimeout(t); const [c,id]=key.split('/'); flush(c,id); } });

boot();
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
